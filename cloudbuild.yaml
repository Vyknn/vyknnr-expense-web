steps:
#step 1
- name: 'gcr.io/cloud-builders/docker' 
  entrypoint: 'bash'
  args: [
    '-c', 
    'docker pull gcr.io/$PROJECT_ID/vyknnr-expense-web:latest || exit 0'
  ]
#step 2
- name: gcr.io/cloud-builders/docker
  args: [
    'build', 
    '--build-arg',
    'BUILD=$SHORT_SHA',
    '-t', 
    'asia.gcr.io/$PROJECT_ID/vyknnr-expense-web:$SHORT_SHA',
    '-t', 
    'asia.gcr.io/$PROJECT_ID/vyknnr-expense-web:latest',
    '.'
  ]
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'push',
    'asia.gcr.io/$PROJECT_ID/vyknnr-expense-web:$SHORT_SHA'
  ]
#step 3
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'vyknnr-expense-web'
  - '--image'
  - 'asia.gcr.io/$PROJECT_ID/vyknnr-expense-web:$SHORT_SHA'
  - '--region'
  - 'asia-southeast1'
  - '--allow-unauthenticated'
# push images to Google Container Registry with tags
images: [
   'asia.gcr.io/$PROJECT_ID/vyknnr-expense-web:$SHORT_SHA',
   'asia.gcr.io/$PROJECT_ID/vyknnr-expense-web:latest'
]
options:
  # machineType: E2_HIGHCPU_8  
  logging: CLOUD_LOGGING_ONLY